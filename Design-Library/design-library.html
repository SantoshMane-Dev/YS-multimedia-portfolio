<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design Portfolio | YS Multimedia & Designs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="design-library.css" />
  </head>
  <body>
    <header class="library-navbar">
      <a href="../index.html#about" class="back-button"
        ><i class="fa-solid fa-arrow-left"></i> Back to Designs</a
      ><a href="../index.html"
        ><img
          src="../assets/logo.png"
          class="library-logo"
          alt="YS Multimedia & Designs"
      /></a>
    </header>
    <main>
      <section class="library-hero">
        <span class="library-eyebrow">YS MULTIMEDIA & DESIGNS</span>
        <h1 id="design-library-title">Design Portfolio</h1>
        <p id="design-library-description">Explore our creative work.</p>
        <div class="heading-line"></div>
      </section>
      <section class="design-gallery" id="design-library"></section>
      <section class="empty-design-library" id="empty-design-library">
        <i class="fa-regular fa-image"></i>
        <h2>No Designs Yet</h2>
        <p>Designs for this category will be added here soon.</p>
        <a href="../index.html#about" class="back-home">Back to Website</a>
      </section>
    </main>
    <div class="image-modal" id="image-modal">
      <button id="modal-close" aria-label="Close">
        <i class="fa-solid fa-xmark"></i></button
      ><img id="modal-image" src="" alt="" />
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../portfolio-config.js"></script>
    <script src="design-library.js"></script>
  </body>
</html>
